version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: xrayprobe
    main: ./cmd/xrayprobe
    binary: xrayprobe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "xrayprobe_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto
